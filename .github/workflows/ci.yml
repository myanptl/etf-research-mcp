name: ci

# Every repo here had a build script and most had tests, but nothing was
# running them. This catches a broken build before it reaches a deploy.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # --if-present so a repo without a test script is not a failure.
      - name: Test
        run: npm test --if-present
